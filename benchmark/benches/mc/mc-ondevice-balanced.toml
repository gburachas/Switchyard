# ON-DEVICE variant of mc-balanced: weak + classifier = Spark llama.cpp (loopback), strong = cloud Opus.
# Native Switchyard routing profile. `session_affinity = true` is the sticky control.
# To compare it with per-user-turn routing, add a native `followup` table to a copied profile.

schema_version = 1

[llm_clients.strong]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.weak]
format = "openai_chat"
base_url = "http://127.0.0.1:8001/v1"
timeout_secs = 300

[llm_clients.classifier]
format = "openai_chat"
base_url = "http://127.0.0.1:8001/v1"
timeout_secs = 120

[targets.strong]
id = "anthropic/claude-opus-4.7"
llm_client = "strong"

[targets.weak]
id = "local-weak"
llm_client = "weak"

[targets.classifier]
id = "local-weak"
llm_client = "classifier"

[routes.switchyard]
id = "switchyard"
type = "llm_classifier"
classifier_target = "classifier"
mode = "custom"
recent_turn_window = 6
session_affinity = true
targets = ["weak", "strong"]
default_target = "strong"
response_schema = '''
{
  "type": "object",
  "properties": {
    "route": { "type": "string", "enum": ["weak", "strong"] },
    "confidence": { "type": "number" },
    "abstain": { "type": "boolean" }
  },
  "required": ["route", "confidence", "abstain"],
  "additionalProperties": false
}
'''
prompt = '''
You are a routing classifier for a general assistant (research, documents,
Q&A, planning). You see a condensed conversation view and return exactly one
JSON object:

{"route": "weak" or "strong", "confidence": number 0..1, "abstain": boolean}

State the route DIRECTLY: "weak" = the on-device assistant handles this turn;
"strong" = escalate this turn to the frontier model.

Decide the tier for the user's NEWEST request. DISCRIMINATE BY KIND OF WORK.

Route route "weak" when the request is DIRECT — one lookup, one
transformation, or one clearly-scoped step:
  factual lookups with an obvious source, summarizing a provided text,
  reformatting/rewriting with clear instructions, extracting fields, simple
  arithmetic, list/compare when the criteria are given, relaying tool results.

Route route "strong" when the request needs SYNTHESIS or
NON-OBVIOUS REASONING:
  multi-hop questions (answer depends on combining several retrieved facts),
  math/logic beyond one step, reconciling conflicting sources, planning with
  trade-offs, anything where a plausible-but-wrong answer is hard to detect.

Heuristic: "Could a competent junior do this with the sources at hand (weak),
or does it need judgment across pieces (strong)?"

Set abstain=true only when truly unclassifiable. No markdown, no
chain-of-thought — only the JSON object.
'''

[routes.switchyard.policy]
type = "target_selector"
selector = "/route"
