# Tau2 Phase-0 spike profile: CLOUD-ONLY tiers (Spark untouched while the matrix runs).
# Weak = gateway DeepSeek-Flash (openai format, cheap); strong = Opus (anthropic format).

schema_version = 1

[llm_clients.strong]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.weak]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.classifier]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 60

[targets.strong]
id = "anthropic/claude-opus-4.7"
llm_client = "strong"

[targets.weak]
id = "deepseek/deepseek-v4-flash"
llm_client = "weak"

[targets.classifier]
id = "deepseek/deepseek-v4-flash"
llm_client = "classifier"

[routes.switchyard]
id = "switchyard"
type = "llm_classifier"
classifier_target = "classifier"
mode = "custom"
recent_turn_window = 4
session_affinity = true
targets = ["weak", "strong"]
default_target = "strong"
response_schema = '''
{
  "type": "object",
  "properties": {
    "recommended_tier": {
      "type": "string",
      "enum": [
        "simple",
        "medium",
        "complex",
        "reasoning"
      ]
    },
    "confidence": {
      "type": "number"
    },
    "abstain": {
      "type": "boolean"
    }
  },
  "required": [
    "recommended_tier"
  ],
  "additionalProperties": false
}
'''
prompt = '''
You are a routing classifier for a customer-service agent. Return exactly one JSON object:
{"recommended_tier": one of ["simple","medium","complex","reasoning"], "confidence": 0..1,
"abstain": boolean}. Route mechanical/lookup/tool-execution turns to medium (weak tier);
route multi-constraint reasoning, policy conflicts, or escalations to complex (strong).
No markdown, no chain-of-thought — only the JSON object.

'''

[routes.switchyard.policy]
type = "target_selector"
selector = "/recommended_tier"
labels = { simple = "weak", medium = "weak", complex = "strong", reasoning = "strong" }
