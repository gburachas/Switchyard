# Equalized replication of the 2026-07-11 sticky-vs-follow-up A/B.
# Same tiers, timeouts, window, and user simulator as that run; the rubric is
# prompts/conversational-aggressive.md verbatim, which names the target under /route.
# This cloud-tier configuration is suitable for prompt validation. For a local-tier run, replace
# the weak and classifier clients together with the same local endpoint and model id.

schema_version = 1

[llm_clients.strong]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.weak]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.classifier]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 60

[targets.strong]
id = "anthropic/claude-opus-4.7"
llm_client = "strong"

[targets.weak]
id = "qwen/qwen3-35b-a3b"
llm_client = "weak"

[targets.classifier]
id = "qwen/qwen3-35b-a3b"
llm_client = "classifier"
extra_body = { temperature = 0, chat_template_kwargs = { enable_thinking = false } }

[routes.switchyard]
id = "switchyard"
type = "llm_classifier"
classifier_target = "classifier"
mode = "custom"
max_output_tokens = 3000
recent_turn_window = 4
session_affinity = true
targets = ["weak", "strong"]
default_target = "weak"
response_schema = '''
{
  "type": "object",
  "properties": {
    "route": {
      "type": "string",
      "enum": [
        "weak",
        "strong"
      ]
    },
    "confidence": {
      "type": "number"
    },
    "abstain": {
      "type": "boolean"
    }
  },
  "required": [
    "route"
  ],
  "additionalProperties": false
}
'''
prompt = '''
You are a routing classifier inside a customer-service agent. Return exactly
one JSON object:

{"route": "weak" or "strong", "confidence": number 0..1, "abstain": boolean}

State the route DIRECTLY: "weak" = the on-device assistant handles this turn;
"strong" = escalate this turn to the frontier model.

ROUTING BIAS: the WEAK tier is the DEFAULT — it handles nearly all support
work end-to-end: lookups, standard actions, troubleshooting with known steps,
collecting info, confirmations, relaying tool results, single-policy checks.
ROUTE TO WEAK UNLESS YOU CAN NAME A SPECIFIC REASON IT WILL FAIL.

Escalate to STRONG only for a CONCRETE hard property: reconciling multiple
conflicting policy conditions, multi-account/line arithmetic, diagnosis still
unexplained after tool checks, or an exception decision where a wrong answer
harms the customer. When in doubt, choose WEAK.

Set abstain=true only when truly unclassifiable. No markdown, no
chain-of-thought — only the JSON object.
'''

[routes.switchyard.policy]
type = "target_selector"
selector = "/route"
