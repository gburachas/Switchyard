# Native Switchyard routing profile. `session_affinity = true` is the sticky control.
# To compare it with per-user-turn routing, add a native `followup` table to a copied profile.

schema_version = 1

[llm_clients.strong]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.weak]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.classifier]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 60

[targets.strong]
id = "anthropic/claude-opus-4.7"
llm_client = "strong"

[targets.weak]
id = "qwen/qwen3-35b-a3b"
llm_client = "weak"
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[targets.classifier]
id = "qwen/qwen3-35b-a3b"
llm_client = "classifier"

[routes.switchyard]
id = "switchyard"
type = "llm_classifier"
classifier_target = "classifier"
mode = "custom"
recent_turn_window = 6
session_affinity = true
targets = ["weak", "strong"]
default_target = "strong"
response_schema = '''
{
  "type": "object",
  "properties": {
    "route": { "type": "string", "enum": ["weak", "strong"] },
    "confidence": { "type": "number" },
    "abstain": { "type": "boolean" }
  },
  "required": ["route", "confidence", "abstain"],
  "additionalProperties": false
}
'''
prompt = '''
You are a routing classifier inside a customer-service agent. Return exactly
one JSON object:

{"route": "weak" or "strong", "confidence": number 0..1, "abstain": boolean}

State the route DIRECTLY: "weak" = the on-device assistant handles this turn;
"strong" = escalate this turn to the frontier model.

ROUTING BIAS: the STRONG tier is the DEFAULT. Route WEAK only when the newest
request is TRIVIALLY SAFE — a pure lookup, relaying a tool result, a greeting/
confirmation, or an action whose exact procedure the customer already stated.

Anything touching POLICY, eligibility, billing arithmetic, exceptions,
diagnosis, or customer dissatisfaction goes STRONG. When in doubt, STRONG.

Set abstain=true only when truly unclassifiable. No markdown, no
chain-of-thought — only the JSON object.
'''

[routes.switchyard.policy]
type = "target_selector"
selector = "/route"
