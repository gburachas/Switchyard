#
# Stage-router (signal-driven capable/efficient) profile for the analysis runs.
# Routes on tool-result signals; no per-turn LLM call at confidence_threshold=0.5.

schema_version = 1

[llm_clients.strong]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 600

[llm_clients.weak]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 600

[targets.strong]
id = "anthropic/claude-opus-4.7"
llm_client = "strong"

[targets.weak]
id = "qwen/qwen3-35b-a3b"
llm_client = "weak"

[routes.switchyard]
id = "switchyard"
type = "stage_router"
capable_target = "strong"
efficient_target = "weak"
picker = "capable_first"
confidence_threshold = 0.5
recent_turn_window = 3
