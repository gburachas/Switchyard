#
# PER-TURN variant of llm-classifier-sticky-opus-qwen.toml: identical tiers and
# (profile-default, turn-framed) classifier prompt, but session affinity is
# REMOVED so the classifier runs on EVERY turn and the tier is re-decided per
# turn (no sticky pin). Used for both TB-Lite and TB2.

schema_version = 1

[llm_clients.strong]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 600

[llm_clients.weak]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 600

[llm_clients.classifier]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 30

[targets.strong]
id = "anthropic/claude-opus-4.7"
llm_client = "strong"
extra_body = { thinking = { type = "adaptive" }, output_config = { effort = "high" } }

[targets.weak]
id = "qwen/qwen3-35b-a3b"
llm_client = "weak"

[targets.classifier]
id = "qwen/qwen3-35b-a3b"
llm_client = "classifier"

[routes.switchyard]
id = "switchyard"
type = "llm_classifier"
classifier_target = "classifier"
mode = "capability"
strong_target = "strong"
weak_target = "weak"
base_threshold = 0.5
recent_turn_window = 4
