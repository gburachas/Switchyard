# Native Switchyard routing profile. `session_affinity = true` is the sticky control.
# To compare it with per-user-turn routing, add a native `followup` table to a copied profile.

schema_version = 1

[llm_clients.strong]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.weak]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 300

[llm_clients.classifier]
format = "openai_chat"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
timeout_secs = 60

[targets.strong]
id = "anthropic/claude-opus-4.7"
llm_client = "strong"

[targets.weak]
id = "qwen/qwen3-35b-a3b"
llm_client = "weak"

[targets.classifier]
id = "qwen/qwen3-35b-a3b"
llm_client = "classifier"

[routes.switchyard]
id = "switchyard"
type = "llm_classifier"
classifier_target = "classifier"
mode = "custom"
recent_turn_window = 6
session_affinity = true
targets = ["weak", "strong"]
default_target = "strong"
response_schema = '''
{
  "type": "object",
  "properties": {
    "route": { "type": "string", "enum": ["weak", "strong"] },
    "confidence": { "type": "number" },
    "abstain": { "type": "boolean" }
  },
  "required": ["route", "confidence", "abstain"],
  "additionalProperties": false
}
'''
prompt = '''
You are a routing classifier inside a general-purpose computer agent (OpenClaw).
The agent handles productivity and coding tasks: web research, calendars, file
transforms, log analysis, writing, small coding jobs. You see a condensed view
of the task/conversation. Return exactly one JSON object:

{"route": "weak" or "strong", "confidence": number 0..1, "abstain": boolean}

State the route DIRECTLY: "weak" = the small on-device model handles this turn;
"strong" = escalate this turn to the frontier model.

Route "weak" when the task is a SINGLE bounded transformation or lookup the
small model can complete in one or two passes over provided material:
  summarizing or rewriting provided text, format conversion, extracting fields
  from given data, simple single-file edits, answering from supplied context,
  greetings and confirmations.

Route "strong" when the task needs PLANNING, TOOLS, or PRECISION:
  anything requiring web browsing/search or external tool orchestration,
  calendar/scheduling with constraints, multi-file or multi-step coding,
  log/data analysis where a plausible-but-wrong answer is easy, research plus
  synthesis across sources, strict output contracts (exact JSON schemas or
  file formats that get machine-checked), long multi-part instructions.

Heuristic: "Could a capable small model do this in one pass over the given
text (weak), or does it need to act in the world or keep many constraints
straight (strong)?" When unsure about a tool-driven task, choose strong.

Set abstain=true only if truly unclassifiable. No markdown, no
chain-of-thought — only the JSON object.
'''

[routes.switchyard.policy]
type = "target_selector"
selector = "/route"
